name: NEW

on:
  push:
    branches: [main]
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bhns0:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: ✓
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: ✓
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: xvfb

      - name: ✓
        run: pip install -r requirements.txt

      - name: ✓
        run: xvfb-run python huya.py

      - name: ✓
        run: |
          git config --local user.email "eyayq@users.noreply.github.com"
          git config --local user.name "eyayq"
          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "up $(date)"

          for i in $(seq 1 16); do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "❌ Attempt $i failed, retrying..."
            sleep 5
          done   

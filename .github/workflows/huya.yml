name: Update

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'   # setiap 30 menit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests curl-cffi deep-translator

      - name: Generate playlist
        run: python3 huya.py --output playlist.m3u --rooms 500 --workers 18   

      - name: Commit & push
        run: |
          git config user.name "eyayq"
          git config user.email "eyayq@users.noreply.github.com"
          if git diff --quiet -- playlist.m3u; then
            echo "No changes"
          else
            git add playlist.m3u
            git commit -m "auto: update playlist ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi   

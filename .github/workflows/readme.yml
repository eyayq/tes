name: cp pl

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'   # setiap 30 menit
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: ✓
        uses: actions/checkout@v4
        with:
          repository: eyayq/tes
          token: ${{ secrets.GH_TOKEN }}
          path: source

      - name: ✓
        uses: actions/checkout@v4
        with:
          repository: eyayq/eliv
          token: ${{ secrets.GH_TOKEN }}
          path: destination

      - name: ✓
        run: |
          cp source/README.md destination/README.md
          echo "Fl"

      - name: ✓
        working-directory: destination
        run: |
          git config user.name "eyayq"
          git config user.email "eyayq@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Up"
          git push   
